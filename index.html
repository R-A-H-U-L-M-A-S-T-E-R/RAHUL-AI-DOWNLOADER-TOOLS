<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL-AI QUANTUM DOWNLOADER | RAHUL MASTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
            background: #030105;
        }

        /* Fast Pulsing Red & Blue Background Lighting Effects */
        .bg-lighting {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 70, 0.55), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 120, 255, 0.55), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 150, 0.3), transparent 60%);
            animation: ultraFastPulse 1.8s ease-in-out infinite alternate;
        }

        @keyframes ultraFastPulse {
            0% { 
                transform: scale(1); 
                filter: hue-rotate(0deg) brightness(0.9); 
            }
            100% { 
                transform: scale(1.25); 
                filter: hue-rotate(60deg) brightness(1.4); 
            }
        }

        .ambient-orb-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: rgba(255, 0, 80, 0.3);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -2;
            animation: orbMove1 3s ease-in-out infinite alternate;
        }

        .ambient-orb-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: rgba(0, 120, 255, 0.3);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -2;
            animation: orbMove2 3s ease-in-out infinite alternate;
        }

        @keyframes orbMove1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(15vw, 15vh) scale(1.2); }
        }

        @keyframes orbMove2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-15vw, -15vh) scale(1.2); }
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 25px 25px;
        }

        /* Status Bar */
        .status-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b0c14;
            border: 1px solid rgba(0, 120, 255, 0.4);
            border-radius: 14px;
            padding: 10px 18px;
            margin-bottom: 18px;
            font-size: 12px;
            color: #94a3b8;
            box-shadow: 0 0 20px rgba(0, 120, 255, 0.2);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Container */
        .container {
            max-width: 480px;
            width: 100%;
            background: #07080c;
            border-radius: 24px;
            padding: 28px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: smoothContainerFloat 4s ease-in-out infinite alternate;
        }

        @keyframes smoothContainerFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 21px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff004c, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 12px;
            color: #64748b;
        }

        /* Platform Icons */
        .platforms-hint {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            font-size: 18px;
            color: #64748b;
        }

        .platforms-hint i {
            transition: all 0.3s ease;
        }

        .platforms-hint i:hover {
            color: #0080ff;
            transform: translateY(-3px) scale(1.2);
        }

        /* Input Group */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #030407;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 6px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #ff004c;
            box-shadow: 0 0 15px rgba(255, 0, 76, 0.4);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group button {
            padding: 0 18px;
            background: linear-gradient(135deg, #ff004c, #0080ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .input-group button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* Special Feature Quick Actions Grid */
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 9px;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.3s;
        }

        .quick-btn:hover {
            background: rgba(0, 120, 255, 0.2);
            border-color: #0080ff;
            color: #fff;
        }

        /* Result Box */
        .result-box {
            display: none;
            background: #030407;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            animation: slideInZoom 0.4s ease;
        }

        @keyframes slideInZoom {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-box img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-info {
            flex: 1;
            overflow: hidden;
        }

        .video-info h4 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
        }

        .btn-play {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
        }

        .btn-open {
            background: linear-gradient(135deg, #0080ff, #0284c7);
            color: #fff;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Loader */
        .loader {
            display: none;
            text-align: center;
            margin: 15px 0;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ff004c;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer WhatsApp Button */
        .owner-footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .whatsapp-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Fast Pulsing Background Lighting & Orbs -->
    <div class="bg-lighting"></div>
    <div class="ambient-orb-1"></div>
    <div class="ambient-orb-2"></div>
    <div class="bg-grid"></div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-item" id="liveTime"><i class="fa-regular fa-clock" style="color: #ff004c;"></i> --:-- --</div>
        <div class="status-item" id="liveDate"><i class="fa-regular fa-calendar-days" style="color: #0080ff;"></i> --/--/----</div>
        <div class="status-item" id="batteryStatus"><i class="fa-solid fa-battery-half" style="color: #10b981;"></i> --%</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="header">
            <h1>RAHUL-AI QUANTUM DOWNLOADER</h1>
            <p>Paste link or search video title directly</p>
        </div>

        <div class="platforms-hint">
            <i class="fa-brands fa-facebook" title="Facebook Downloader"></i>
            <i class="fa-brands fa-instagram" title="Instagram"></i>
            <i class="fa-brands fa-youtube" title="YouTube"></i>
            <i class="fa-solid fa-magnifying-glass" title="Video Search"></i>
            <i class="fa-solid fa-music" title="Play / Audio DL"></i>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste link or type video/song name...">
            <button onclick="autoFetchMedia()"><i class="fa-solid fa-bolt"></i></button>
        </div>

        <!-- Quick Platform & Search Features -->
        <div class="quick-buttons">
            <button class="quick-btn" onclick="fetchFBDirect()"><i class="fa-brands fa-facebook" style="color: #0080ff;"></i> FB Downloader</button>
            <button class="quick-btn" onclick="triggerSearch()"><i class="fa-solid fa-magnifying-glass" style="color: #ff0055;"></i> Video Search</button>
            <button class="quick-btn" onclick="triggerPlayDL()"><i class="fa-solid fa-headphones" style="color: #a855f7;"></i> Play (Audio DL)</button>
            <button class="quick-btn" onclick="clearInput()"><i class="fa-solid fa-rotate-right"></i> Clear</button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="font-size: 11px; margin-top: 6px; color: #ff004c;" id="loaderMsg">Fetching media...</p>
        </div>

        <div class="result-box" id="resultBox">
            <img id="thumbnail" src="" alt="Thumbnail">
            <div class="video-info">
                <h4 id="videoTitle">Media Ready</h4>
                <div class="action-btns">
                    <a id="downloadBtn" href="#" class="btn btn-download" download target="_blank"><i class="fa-solid fa-video"></i> Video DL</a>
                    <a id="playBtn" href="#" class="btn btn-play" download target="_blank"><i class="fa-solid fa-music"></i> Play MP3</a>
                    <a id="openBtn" href="#" class="btn btn-open" target="_blank"><i class="fa-solid fa-external-link-alt"></i> Stream</a>
                </div>
            </div>
        </div>

        <div class="owner-footer">
            <a href="https://wa.me/919356730236?text=Hello%20RAHUL%20MASTER,%20I%20want%20to%20talk%20about%20your%20Downloader!" class="whatsapp-btn" target="_blank">
                <i class="fa-brands fa-whatsapp" style="font-size: 15px;"></i> Contact Owner on WhatsApp
            </a>
        </div>
    </div>

    <script>
        // Live Clock and Date
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;

            document.getElementById('liveTime').innerHTML = `<i class="fa-regular fa-clock" style="color: #ff004c;"></i> ${hours}:${minutes} ${ampm}`;
            
            const options = { day: 'numeric', month: 'short' };
            const dateStr = now.toLocaleDateString('en-US', options);
            document.getElementById('liveDate').innerHTML = `<i class="fa-regular fa-calendar-days" style="color: #0080ff;"></i> ${dateStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Battery Status Integration
        async function initBattery() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    function updateBatteryInfo() {
                        const level = Math.floor(battery.level * 100);
                        const isCharging = battery.charging;
                        let iconClass = "fa-battery-full";
                        let iconColor = "#10b981";

                        if (level <= 20) { iconClass = "fa-battery-empty"; iconColor = "#ef4444"; }
                        else if (level <= 50) { iconClass = "fa-battery-half"; iconColor = "#f59e0b"; }

                        if (isCharging) {
                            document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-bolt" style="color: #ff004c;"></i> ${level}%`;
                        } else {
                            document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid ${iconClass}" style="color: ${iconColor};"></i> ${level}%`;
                        }
                    }
                    updateBatteryInfo();
                    battery.addEventListener('levelchange', updateBatteryInfo);
                    battery.addEventListener('chargingchange', updateBatteryInfo);
                } catch (e) {
                    document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-battery-bolt" style="color: #ff004c;"></i> 100%`;
                }
            } else {
                document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-battery-bolt" style="color: #ff004c;"></i> 100%`;
            }
        }
        initBattery();

        function clearInput() {
            document.getElementById('videoUrl').value = '';
            document.getElementById('resultBox').style.display = 'none';
        }

        // Facebook Dedicated Downloader Action
        async function fetchFBDirect() {
            const queryVal = document.getElementById('videoUrl').value.trim();
            if(!queryVal || (!queryVal.includes('facebook.com') && !queryVal.includes('fb.watch') && !queryVal.includes('fb.me'))) {
                alert("Please paste a valid Facebook video link!");
                return;
            }
            autoFetchMedia();
        }

        // Video Search Trigger
        function triggerSearch() {
            const queryVal = document.getElementById('videoUrl').value.trim();
            if(!queryVal) {
                alert("Enter a video title or search phrase!");
                return;
            }
            autoFetchMedia();
        }

        // Play / Audio DL Trigger
        function triggerPlayDL() {
            const queryVal = document.getElementById('videoUrl').value.trim();
            if(!queryVal) {
                alert("Enter a song title or video link to extract Audio/Play DL!");
                return;
            }
            autoFetchMedia();
        }

        // Universal Auto-Detection, Search & FB Engine
        async function autoFetchMedia() {
            const queryVal = document.getElementById('videoUrl').value.trim();
            if(!queryVal) {
                alert("Please enter a video link or search term!");
                return;
            }

            document.getElementById('loaderMsg').innerText = "Extracting media & search results...";
            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';

            try {
                let apiUrl = '';
                if (queryVal.includes('facebook.com') || queryVal.includes('fb.watch') || queryVal.includes('fb.me')) {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/facebook?url=${encodeURIComponent(queryVal)}`;
                } else if (queryVal.includes('instagram.com')) {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/insta?url=${encodeURIComponent(queryVal)}`;
                } else {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/video?query=${encodeURIComponent(queryVal)}`;
                }

                const response = await fetch(apiUrl);
                const data = await response.json();
                
                document.getElementById('loader').style.display = 'none';

                if (data) {
                    const videoLink = data.url || data.download_url || data.video_url || data.result || data.link;
                    const audioLink = data.audio || data.mp3 || data.audio_url || videoLink;
                    const thumb = data.thumbnail || data.cover || data.image || "https://images.unsplash.com/photo-1611671755657-f3942ec15b13?w=300";
                    const title = data.title || data.name || "Media File Ready";

                    if (videoLink) {
                        document.getElementById('thumbnail').src = thumb;
                        document.getElementById('videoTitle').innerText = title;
                        
                        document.getElementById('downloadBtn').href = videoLink;
                        document.getElementById('playBtn').href = audioLink;
                        document.getElementById('openBtn').href = videoLink;

                        document.getElementById('resultBox').style.display = 'flex';
                    } else {
                        alert("Could not extract media link. Try another query or link.");
                    }
                } else {
                    alert("No response received from server.");
                }
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                alert("Error: " + error.message);
            }
        }
    </script>
</body>
</html>
