<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL-AI DOWNLOADER | RAHUL MASTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
            background: #020617;
        }

        /* Dynamic Aurora Background Animation */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 10% 20%, rgba(147, 51, 234, 0.25), transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.25), transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.2), transparent 50%);
            animation: auroraFlow 10s ease infinite alternate;
        }

        @keyframes auroraFlow {
            0% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); filter: hue-rotate(180deg); }
            100% { transform: scale(1) rotate(0deg); filter: hue-rotate(360deg); }
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: -1;
        }

        /* Status Bar */
        .status-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 10px 18px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #cbd5e1;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Glass Card with Smooth Gradient Glow Animation */
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.12);
            animation: cardFloat 6s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(147, 51, 234, 0.2); }
            50% { transform: translateY(-6px); box-shadow: 0 35px 70px rgba(0, 0, 0, 0.8), 0 0 40px rgba(59, 130, 246, 0.3); }
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #3b82f6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 400;
        }

        /* Supported Platform Badges */
        .platforms-hint {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
            font-size: 16px;
            color: #94a3b8;
        }

        .platforms-hint i {
            transition: 0.3s;
        }
        .platforms-hint i:hover {
            color: #a855f7;
            transform: scale(1.2);
        }

        /* Input Group Animation */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 6px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group button {
            padding: 0 20px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .input-group button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        }

        /* Result Box Animation */
        .result-box {
            display: none;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 16px;
            padding: 12px;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-info {
            flex: 1;
            overflow: hidden;
        }

        .video-info h4 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5);
        }

        .btn-open {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.5);
        }

        /* Loader */
        .loader {
            display: none;
            text-align: center;
            margin: 15px 0;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer WhatsApp Button */
        .owner-footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            transition: 0.3s;
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 25px rgba(37, 211, 102, 0.6);
        }
    </style>
</head>
<body>

    <!-- Dynamic Background Elements -->
    <div class="aurora-bg"></div>
    <div class="bg-overlay"></div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-item" id="liveTime"><i class="fa-regular fa-clock" style="color: #a855f7;"></i> --:-- --</div>
        <div class="status-item" id="liveDate"><i class="fa-regular fa-calendar-days" style="color: #3b82f6;"></i> --/--/----</div>
        <div class="status-item" id="batteryStatus"><i class="fa-solid fa-battery-half" style="color: #10b981;"></i> --%</div>
    </div>

    <!-- Main Card -->
    <div class="container">
        <div class="header">
            <h1>⚡ RAHUL UNIVERSAL AI</h1>
            <p>Paste any link & download instantly</p>
        </div>

        <div class="platforms-hint">
            <i class="fa-brands fa-instagram" title="Instagram"></i>
            <i class="fa-brands fa-facebook" title="Facebook"></i>
            <i class="fa-brands fa-youtube" title="YouTube"></i>
            <i class="fa-brands fa-tiktok" title="TikTok"></i>
            <i class="fa-brands fa-twitter" title="Twitter/X"></i>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste any app link here (Insta, FB, YT)...">
            <button onclick="fetchUniversalMedia()"><i class="fa-solid fa-download"></i></button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="font-size: 11px; margin-top: 6px; color: #a855f7;">Detecting & fetching media...</p>
        </div>

        <div class="result-box" id="resultBox">
            <img id="thumbnail" src="" alt="Thumbnail">
            <div class="video-info">
                <h4 id="videoTitle">Media Ready</h4>
                <div class="action-btns">
                    <a id="downloadBtn" href="#" class="btn btn-download" download target="_blank"><i class="fa-solid fa-download"></i> Download</a>
                    <a id="openBtn" href="#" class="btn btn-open" target="_blank"><i class="fa-solid fa-external-link-alt"></i> Open</a>
                </div>
            </div>
        </div>

        <div class="owner-footer">
            <a href="https://wa.me/919356730236?text=Hello%20RAHUL%20MASTER,%20I%20want%20to%20talk%20about%20your%20Universal%20Downloader!" class="whatsapp-btn" target="_blank">
                <i class="fa-brands fa-whatsapp" style="font-size: 15px;"></i> Contact Owner on WhatsApp
            </a>
        </div>
    </div>

    <script>
        // Live Clock and Date
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;

            document.getElementById('liveTime').innerHTML = `<i class="fa-regular fa-clock" style="color: #a855f7;"></i> ${hours}:${minutes} ${ampm}`;
            
            const options = { day: 'numeric', month: 'short' };
            const dateStr = now.toLocaleDateString('en-US', options);
            document.getElementById('liveDate').innerHTML = `<i class="fa-regular fa-calendar-days" style="color: #3b82f6;"></i> ${dateStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Battery Status Integration
        async function initBattery() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    function updateBatteryInfo() {
                        const level = Math.floor(battery.level * 100);
                        const isCharging = battery.charging;
                        let iconClass = "fa-battery-full";
                        let iconColor = "#10b981";

                        if (level <= 20) { iconClass = "fa-battery-empty"; iconColor = "#ef4444"; }
                        else if (level <= 50) { iconClass = "fa-battery-half"; iconColor = "#f59e0b"; }

                        if (isCharging) {
                            document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-bolt" style="color: #38bdf8;"></i> ${level}%`;
                        } else {
                            document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid ${iconClass}" style="color: ${iconColor};"></i> ${level}%`;
                        }
                    }
                    updateBatteryInfo();
                    battery.addEventListener('levelchange', updateBatteryInfo);
                    battery.addEventListener('chargingchange', updateBatteryInfo);
                } catch (e) {
                    document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-battery-bolt" style="color: #38bdf8;"></i> 100%`;
                }
            } else {
                document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-battery-bolt" style="color: #38bdf8;"></i> 100%`;
            }
        }
        initBattery();

        // Universal Smart Auto-Detection Downloader Function
        async function fetchUniversalMedia() {
            const queryVal = document.getElementById('videoUrl').value.trim();
            if(!queryVal) {
                alert("Please paste a valid video link or URL!");
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';

            try {
                // Smart auto-detection based on URL contents
                let apiUrl = '';
                if (queryVal.includes('instagram.com')) {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/insta?url=${encodeURIComponent(queryVal)}`;
                } else if (queryVal.includes('facebook.com') || queryVal.includes('fb.watch') || queryVal.includes('fb.me')) {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/facebook?url=${encodeURIComponent(queryVal)}`;
                } else {
                    // Default universal fallback or video handler
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/video?query=${encodeURIComponent(queryVal)}`;
                }

                const response = await fetch(apiUrl);
                const data = await response.json();
                
                document.getElementById('loader').style.display = 'none';

                if (data) {
                    const mediaLink = data.url || data.download_url || data.video_url || data.result || data.link;
                    const thumb = data.thumbnail || data.cover || data.image || "https://images.unsplash.com/photo-1611671755657-f3942ec15b13?w=300";
                    const title = data.title || data.name || "Media Download Ready";

                    if (mediaLink) {
                        document.getElementById('thumbnail').src = thumb;
                        document.getElementById('videoTitle').innerText = title;
                        
                        document.getElementById('downloadBtn').href = mediaLink;
                        document.getElementById('openBtn').href = mediaLink;

                        document.getElementById('resultBox').style.display = 'flex';
                    } else {
                        alert("Could not extract download link. Please check the URL.");
                    }
                } else {
                    alert("No data received from server.");
                }
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                alert("Request Error: " + error.message);
            }
        }
    </script>
</body>
</html>
