<head>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
            background: #020204;
        }

        /* Subtle Dark Grid Background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Dynamic Auto-Changing Status Bar Border */
        .status-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #090a10;
            border-radius: 14px;
            padding: 10px 18px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #e2e8f0;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .status-bar::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bbf, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            z-index: -1;
            border-radius: 15px;
            animation: autoLightingFlow 8s linear infinite;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Container: Pure Solid Black Box with Smooth RGB Auto-Lighting Border */
        .container {
            max-width: 480px;
            width: 100%;
            background: #08090f; /* Pure Solid Dark Interior */
            border-radius: 24px;
            padding: 28px;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
        }

        /* Continuous Auto Rainbow Lighting Border Animation */
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff0055, #7a00ff, #00e5ff, #00ff66, #ffcc00, #ff0055);
            background-size: 400%;
            z-index: -1;
            border-radius: 26px;
            animation: autoLightingFlow 6s linear infinite;
        }

        @keyframes autoLightingFlow {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 21px;
            font-weight: 800;
            background: linear-gradient(90deg, #00e5ff, #7a00ff, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Platform Icons */
        .platforms-hint {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            font-size: 18px;
            color: #00e5ff;
        }

        .platforms-hint i {
            transition: 0.3s;
        }
        .platforms-hint i:hover {
            color: #ff0055;
            transform: scale(1.3);
        }

        /* Input Group */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #020306;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 6px;
            transition: 0.3s;
        }

        .input-group:focus-within {
            border-color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group button {
            padding: 0 20px;
            background: linear-gradient(135deg, #00e5ff, #7a00ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }

        .input-group button:hover {
            transform: scale(1.05);
        }

        /* Result Box */
        .result-box {
            display: none;
            background: #0d0f1a;
            border: 1px solid #00ff66;
            border-radius: 14px;
            padding: 12px;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        .result-box img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #00ff66;
        }

        .video-info {
            flex: 1;
            overflow: hidden;
        }

        .video-info h4 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-download {
            background: #00ff66;
            color: #000;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
        }

        .btn-open {
            background: #00e5ff;
            color: #000;
        }

        .btn-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }

        /* Loader */
        .loader {
            display: none;
            text-align: center;
            margin: 15px 0;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer WhatsApp */
        .owner-footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
            transition: 0.3s;
        }

        .whatsapp-btn:hover {
            transform: scale(1.04);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-item" id="liveTime"><i class="fa-regular fa-clock" style="color: #00e5ff;"></i> --:-- --</div>
        <div class="status-item" id="liveDate"><i class="fa-regular fa-calendar-days" style="color: #ff0055;"></i> --/--/----</div>
        <div class="status-item" id="batteryStatus"><i class="fa-solid fa-battery-half" style="color: #00ff66;"></i> --%</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="header">
            <h1>RAHUL-AI AUTO-LIGHTING DOWNLOADER</h1>
            <p>Paste any link & video extracts automatically</p>
        </div>

        <div class="platforms-hint">
            <i class="fa-brands fa-instagram" title="Instagram"></i>
            <i class="fa-brands fa-facebook" title="Facebook"></i>
            <i class="fa-brands fa-youtube" title="YouTube"></i>
            <i class="fa-brands fa-tiktok" title="TikTok"></i>
            <i class="fa-brands fa-twitter" title="Twitter/X"></i>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste any video link here...">
            <button onclick="autoFetchMedia()"><i class="fa-solid fa-bolt"></i></button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="font-size: 11px; margin-top: 6px; color: #00e5ff;">Extracting video link...</p>
        </div>

        <div class="result-box" id="resultBox">
            <img id="thumbnail" src="" alt="Thumbnail">
            <div class="video-info">
                <h4 id="videoTitle">Media Ready</h4>
                <div class="action-btns">
                    <a id="downloadBtn" href="#" class="btn btn-download" download target="_blank"><i class="fa-solid fa-download"></i> Download</a>
                    <a id="openBtn" href="#" class="btn btn-open" target="_blank"><i class="fa-solid fa-external-link-alt"></i> Stream</a>
                </div>
            </div>
        </div>

        <div class="owner-footer">
            <a href="https://wa.me/919356730236?text=Hello%20RAHUL%20MASTER,%20I%20want%20to%20talk%20about%20your%20Auto-Lighting%20Downloader!" class="whatsapp-btn" target="_blank">
                <i class="fa-brands fa-whatsapp" style="font-size: 15px;"></i> Contact Owner on WhatsApp
            </a>
        </div>
    </div>

    <script>
        // Live Clock and Date
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;

            document.getElementById('liveTime').innerHTML = `<i class="fa-regular fa-clock" style="color: #00e5ff;"></i> ${hours}:${minutes} ${ampm}`;
            
            const options = { day: 'numeric', month: 'short' };
            const dateStr = now.toLocaleDateString('en-US', options);
            document.getElementById('liveDate').innerHTML = `<i class="fa-regular fa-calendar-days" style="color: #ff0055;"></i> ${dateStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Battery Status
        async function initBattery() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    function updateBatteryInfo() {
                        const level = Math.floor(battery.level * 100);
                        const isCharging = battery.charging;
                        let iconClass = "fa-battery-full";
                        let iconColor = "#00ff66";

                        if (level <= 20) { iconClass = "fa-battery-empty"; iconColor = "#ff0055"; }
                        else if (level <= 50) { iconClass = "fa-battery-half"; iconColor = "#ffcc00"; }

                        if (isCharging) {
                            document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-bolt" style="color: #00e5ff;"></i> ${level}%`;
                        } else {
                            document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid ${iconClass}" style="color: ${iconColor};"></i> ${level}%`;
                        }
                    }
                    updateBatteryInfo();
                    battery.addEventListener('levelchange', updateBatteryInfo);
                    battery.addEventListener('chargingchange', updateBatteryInfo);
                } catch (e) {
                    document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-battery-bolt" style="color: #00e5ff;"></i> 100%`;
                }
            } else {
                document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-battery-bolt" style="color: #00e5ff;"></i> 100%`;
            }
        }
        initBattery();

        // Auto Link Downloader Function
        async function autoFetchMedia() {
            const queryVal = document.getElementById('videoUrl').value.trim();
            if(!queryVal) {
                alert("Krupaya kontihi link paste kara!");
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';

            try {
                let apiUrl = '';
                if (queryVal.includes('instagram.com')) {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/insta?url=${encodeURIComponent(queryVal)}`;
                } else if (queryVal.includes('facebook.com') || queryVal.includes('fb.watch') || queryVal.includes('fb.me')) {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/facebook?url=${encodeURIComponent(queryVal)}`;
                } else {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/video?query=${encodeURIComponent(queryVal)}`;
                }

                const response = await fetch(apiUrl);
                const data = await response.json();
                
                document.getElementById('loader').style.display = 'none';

                if (data) {
                    const mediaLink = data.url || data.download_url || data.video_url || data.result || data.link;
                    const thumb = data.thumbnail || data.cover || data.image || "https://images.unsplash.com/photo-1611671755657-f3942ec15b13?w=300";
                    const title = data.title || data.name || "Media File Ready";

                    if (mediaLink) {
                        document.getElementById('thumbnail').src = thumb;
                        document.getElementById('videoTitle').innerText = title;
                        
                        document.getElementById('downloadBtn').href = mediaLink;
                        document.getElementById('openBtn').href = mediaLink;

                        document.getElementById('resultBox').style.display = 'flex';
                    } else {
                        alert("Video extract nahi zala. Krupaya link check kara.");
                    }
                } else {
                    alert("Server error.");
                }
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                alert("Error: " + error.message);
            }
        }
    </script>
</body>
