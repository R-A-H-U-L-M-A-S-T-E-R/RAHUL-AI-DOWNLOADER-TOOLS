<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
            background: #030712;
        }

        /* Live Animated Video Background */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.35) contrast(1.25);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 240, 255, 0.25), transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255, 0, 127, 0.25), transparent 50%);
            z-index: -1;
            animation: pulseOverlay 4s infinite alternate ease-in-out;
        }

        @keyframes pulseOverlay {
            0% { transform: scale(1); filter: hue-rotate(0deg); }
            100% { transform: scale(1.1); filter: hue-rotate(360deg); }
        }

        .status-bar {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 14px;
            padding: 8px 16px;
            margin-bottom: 15px;
            font-size: 11px;
            color: #e2e8f0;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Battery Charging Animation */
        .charging-icon {
            animation: bounceCharging 1s infinite alternate;
        }

        @keyframes bounceCharging {
            0% { transform: scale(1); color: #00f0ff; }
            100% { transform: scale(1.15); color: #25d366; }
        }

        /* Main Container with Fast Moving Cyber Border Animation */
        .container {
            max-width: 520px;
            width: 100%;
            background: rgba(10, 14, 30, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            position: relative;
            border: 2px solid transparent;
            animation: cyberBorder 2s linear infinite;
        }

        @keyframes cyberBorder {
            0% { 
                border-color: #00f0ff; 
                box-shadow: 0 0 25px rgba(0, 240, 255, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.3); 
            }
            50% { 
                border-color: #ff007f; 
                box-shadow: 0 0 25px rgba(255, 0, 127, 0.8), inset 0 0 15px rgba(255, 0, 127, 0.3); 
            }
            100% { 
                border-color: #00f0ff; 
                box-shadow: 0 0 25px rgba(0, 240, 255, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.3); 
            }
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #00f0ff, #b000ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        .header p {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 11px;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: #cbd5e1;
            transition: all 0.3s ease;
        }

        .tab:hover {
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .tab.active {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
            transform: translateY(-2px);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 13px 18px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ff007f;
            box-shadow: 0 0 18px rgba(255, 0, 127, 0.8);
        }

        .input-group button {
            padding: 0 22px;
            background: linear-gradient(135deg, #ff007f, #7000ff);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            transition: all 0.3s ease;
            animation: buttonGlow 1s infinite alternate;
        }

        @keyframes buttonGlow {
            0% { box-shadow: 0 0 10px rgba(255, 0, 127, 0.5), 0 0 20px rgba(112, 0, 255, 0.3); }
            100% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.9), 0 0 35px rgba(0, 240, 255, 0.5); }
        }

        .input-group button:hover {
            transform: translateY(-2px) scale(1.06);
        }

        .result-box {
            display: none;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 14px;
            padding: 12px;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            animation: fadeIn 0.4s ease;
        }

        .result-box img {
            width: 85px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #00f0ff;
        }

        .video-info {
            flex: 1;
        }

        .video-info h4 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #f1f5f9;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-download {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 1);
        }

        .btn-open {
            background: #7000ff;
            color: #fff;
            box-shadow: 0 0 15px rgba(112, 0, 255, 0.7);
        }

        .btn-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(112, 0, 255, 1);
        }

        .loader {
            display: none;
            text-align: center;
            margin: 15px 0;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00f0ff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
            box-shadow: 0 0 15px #00f0ff;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .owner-footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            padding: 9px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.6);
            transition: 0.3s;
            animation: whatsappPulse 1.5s infinite alternate;
        }

        @keyframes whatsappPulse {
            0% { box-shadow: 0 0 10px rgba(37, 211, 102, 0.4); }
            100% { box-shadow: 0 0 25px rgba(37, 211, 102, 0.9); }
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px) scale(1.04);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Live Background Video Loop -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://cdn.pixabay.com/video/2020/05/18/39077-422967664_large.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <div class="status-bar">
        <div class="status-item" id="liveTime"><i class="fa-regular fa-clock" style="color: #00f0ff;"></i> --:-- --</div>
        <div class="status-item" id="liveDate"><i class="fa-regular fa-calendar-days" style="color: #ff007f;"></i> --/--/----</div>
        <div class="status-item" id="batteryStatus"><i class="fa-solid fa-battery-half" style="color: #25d366;"></i> --%</div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🚀 RAHUL-AI DOWNLOADER</h1>
            <p>Download & Search Media Instantly</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchPlatform('instagram', event)"><i class="fa-brands fa-instagram"></i> Insta DL</div>
            <div class="tab" onclick="switchPlatform('facebook', event)"><i class="fa-brands fa-facebook"></i> FB DL</div>
            <div class="tab" onclick="switchPlatform('video', event)"><i class="fa-solid fa-video"></i> Video Search</div>
            <div class="tab" onclick="switchPlatform('play', event)"><i class="fa-solid fa-music"></i> Play DL</div>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste Instagram link here...">
            <button onclick="fetchMedia()"><i class="fa-solid fa-arrow-down"></i></button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="font-size: 11px; margin-top: 5px; color: #00f0ff;">Fetching media...</p>
        </div>

        <div class="result-box" id="resultBox">
            <img id="thumbnail" src="" alt="Thumbnail">
            <div class="video-info">
                <h4 id="videoTitle">Media Ready</h4>
                <div class="action-btns">
                    <a id="downloadBtn" href="#" class="btn btn-download" download target="_blank"><i class="fa-solid fa-download"></i> Download</a>
                    <a id="openBtn" href="#" class="btn btn-open" target="_blank"><i class="fa-solid fa-external-link-alt"></i> Open</a>
                </div>
            </div>
        </div>

        <div class="owner-footer">
            <a href="https://wa.me/919356730236?text=Hello%20RAHUL%20MASTER,%20I%20want%20to%20talk%20about%20your%20Master%20Downloader!" class="whatsapp-btn" target="_blank">
                <i class="fa-brands fa-whatsapp" style="font-size: 14px;"></i> Contact Owner on WhatsApp
            </a>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;

            document.getElementById('liveTime.innerHTML` || document.getElementById('liveTime').innerHTML = `<i class="fa-regular fa-clock" style="color: #00f0ff;"></i> ${hours}:${minutes} ${ampm}`;
            
            const options = { day: 'numeric', month: 'short' };
            const dateStr = now.toLocaleDateString('en-US', options);
            document.getElementById('liveDate').innerHTML = `<i class="fa-regular fa-calendar-days" style="color: #ff007f;"></i> ${dateStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Live Battery Status Integration
        async function initBattery() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    function updateBatteryInfo() {
                        const level = Math.floor(battery.level * 100);
                        const isCharging = battery.charging;
                        let iconClass = "fa-battery-full";
                        let iconColor = "#25d366";

                        if (level <= 20) { iconClass = "fa-battery-empty"; iconColor = "#ff007f"; }
                        else if (level <= 50) { iconClass = "fa-battery-half"; iconColor = "#facc15"; }
                        else if (level <= 80) { iconClass = "fa-battery-three-quarters"; iconColor = "#00f0ff"; }

                        if (isCharging) {
                            document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-bolt charging-icon" style="color: #00f0ff;"></i> ${level}%`;
                        } else {
                            document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid ${iconClass}" style="color: ${iconColor};"></i> ${level}%`;
                        }
                    }
                    updateBatteryInfo();
                    battery.addEventListener('levelchange', updateBatteryInfo);
                    battery.addEventListener('chargingchange', updateBatteryInfo);
                } catch (e) {
                    document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-battery-bolt" style="color: #00f0ff;"></i> 100%`;
                }
            } else {
                document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-battery-bolt" style="color: #00f0ff;"></i> 100%`;
            }
        }
        initBattery();

        let currentPlatform = 'instagram';

        function switchPlatform(platform, event) {
            currentPlatform = platform;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(event) event.currentTarget.classList.add('active');
            
            const input = document.getElementById('videoUrl');
            if (platform === 'instagram') {
                input.placeholder = "Paste Instagram link here...";
            } else if (platform === 'facebook') {
                input.placeholder = "Paste Facebook link here...";
            } else if (platform === 'video') {
                input.placeholder = "Search video (e.g., Despacito official)...";
            } else if (platform === 'play') {
                input.placeholder = "Search song (e.g., Shape of You)...";
            }
            document.getElementById('resultBox').style.display = 'none';
        }

        async function fetchMedia() {
            const queryVal = document.getElementById('videoUrl').value.trim();
            if(!queryVal) {
                alert("Please enter a valid URL or search query!");
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';

            try {
                let apiUrl = '';
                if (currentPlatform === 'instagram') {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/insta?url=${encodeURIComponent(queryVal)}`;
                } else if (currentPlatform === 'facebook') {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/facebook?url=${encodeURIComponent(queryVal)}`;
                } else if (currentPlatform === 'video') {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/video?query=${encodeURIComponent(queryVal)}`;
                } else if (currentPlatform === 'play') {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/play?query=${encodeURIComponent(queryVal)}`;
                }

                const response = await fetch(apiUrl);
                const data = await response.json();
                
                document.getElementById('loader').style.display = 'none';

                if (data) {
                    const mediaLink = data.url || data.download_url || data.video_url || data.result || data.link;
                    const thumb = data.thumbnail || data.cover || data.image || "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200";
                    const title = data.title || data.name || "Song Download Ready";

                    if (mediaLink) {
                        document.getElementById('thumbnail').src = thumb;
                        document.getElementById('videoTitle').innerText = title;
                        
                        document.getElementById('downloadBtn').href = mediaLink;
                        document.getElementById('openBtn').href = mediaLink;

                        document.getElementById('resultBox').style.display = 'flex';
                    } else {
                        alert("Could not retrieve media link from API response.");
                    }
                } else {
                    alert("No data received from the API.");
                }
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                alert("API Request Error: " + error.message);
            }
        }
    </script>
</body>
