<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL-AI PREMIUM DOWNLOADER | RAHUL MASTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            background: #090d16;
        }

        /* Status Bar with Subtle Neon Glow */
        .status-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 10px 18px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #94a3b8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
            animation: fadeInDown 0.6s ease;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Container with Smooth Lighting Border Animation */
        .container {
            max-width: 480px;
            width: 100%;
            background: #111827;
            border-radius: 20px;
            padding: 28px;
            position: relative;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            animation: containerGlow 4s ease-in-out infinite alternate, fadeInUp 0.6s ease;
        }

        @keyframes containerGlow {
            0% { border-color: rgba(56, 189, 248, 0.3); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.1); }
            100% { border-color: rgba(168, 85, 247, 0.5); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(168, 85, 247, 0.25); }
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 12px;
            color: #64748b;
        }

        /* Platform Icons */
        .platforms-hint {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            font-size: 18px;
            color: #64748b;
        }

        .platforms-hint i {
            transition: 0.3s;
        }
        .platforms-hint i:hover {
            color: #38bdf8;
            transform: translateY(-3px) scale(1.15);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        /* Input Group */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 6px;
            transition: 0.3s;
        }

        .input-group:focus-within {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group button {
            padding: 0 20px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }

        .input-group button:hover {
            transform: scale(1.04);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        /* Result Box */
        .result-box {
            display: none;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            animation: fadeIn 0.4s ease;
        }

        .result-box img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .video-info {
            flex: 1;
            overflow: hidden;
        }

        .video-info h4 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            transition: 0.2s;
        }

        .btn-download {
            background: #16a34a;
            color: #fff;
            box-shadow: 0 0 10px rgba(22, 163, 74, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(22, 163, 74, 0.6);
        }

        .btn-open {
            background: #0284c7;
            color: #fff;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.3);
        }

        .btn-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.6);
        }

        /* Loader */
        .loader {
            display: none;
            text-align: center;
            margin: 15px 0;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer WhatsApp */
        .owner-footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #1e293b;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #fff;
            padding: 9px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 0 12px rgba(22, 163, 74, 0.4);
            transition: 0.3s;
        }

        .whatsapp-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 18px rgba(22, 163, 74, 0.7);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-item" id="liveTime"><i class="fa-regular fa-clock" style="color: #38bdf8;"></i> --:-- --</div>
        <div class="status-item" id="liveDate"><i class="fa-regular fa-calendar-days" style="color: #38bdf8;"></i> --/--/----</div>
        <div class="status-item" id="batteryStatus"><i class="fa-solid fa-battery-half" style="color: #16a34a;"></i> --%</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="header">
            <h1>RAHUL-AI DOWNLOADER</h1>
            <p>Paste any video link to extract instantly</p>
        </div>

        <div class="platforms-hint">
            <i class="fa-brands fa-instagram" title="Instagram"></i>
            <i class="fa-brands fa-facebook" title="Facebook"></i>
            <i class="fa-brands fa-youtube" title="YouTube"></i>
            <i class="fa-brands fa-tiktok" title="TikTok"></i>
            <i class="fa-brands fa-twitter" title="Twitter/X"></i>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste any video link here...">
            <button onclick="autoFetchMedia()"><i class="fa-solid fa-arrow-down"></i></button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="font-size: 11px; margin-top: 6px; color: #94a3b8;">Fetching video...</p>
        </div>

        <div class="result-box" id="resultBox">
            <img id="thumbnail" src="" alt="Thumbnail">
            <div class="video-info">
                <h4 id="videoTitle">Media Ready</h4>
                <div class="action-btns">
                    <a id="downloadBtn" href="#" class="btn btn-download" download target="_blank"><i class="fa-solid fa-download"></i> Download</a>
                    <a id="openBtn" href="#" class="btn btn-open" target="_blank"><i class="fa-solid fa-external-link-alt"></i> Stream</a>
                </div>
            </div>
        </div>

        <div class="owner-footer">
            <a href="https://wa.me/919356730236?text=Hello%20RAHUL%20MASTER,%20I%20want%20to%20talk%20about%20your%20Downloader!" class="whatsapp-btn" target="_blank">
                <i class="fa-brands fa-whatsapp" style="font-size: 14px;"></i> Contact Owner on WhatsApp
            </a>
        </div>
    </div>

    <script>
        // Live Clock and Date
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;

            document.getElementById('liveTime').innerHTML = `<i class="fa-regular fa-clock" style="color: #38bdf8;"></i> ${hours}:${minutes} ${ampm}`;
            
            const options = { day: 'numeric', month: 'short' };
            const dateStr = now.toLocaleDateString('en-US', options);
            document.getElementById('liveDate').innerHTML = `<i class="fa-regular fa-calendar-days" style="color: #38bdf8;"></i> ${dateStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Battery Status
        async function initBattery() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    function updateBatteryInfo() {
                        const level = Math.floor(battery.level * 100);
                        const isCharging = battery.charging;
                        let iconClass = "fa-battery-full";
                        let iconColor = "#16a34a";

                        if (level <= 20) { iconClass = "fa-battery-empty"; iconColor = "#ef4444"; }
                        else if (level <= 50) { iconClass = "fa-battery-half"; iconColor = "#f59e0b"; }

                        if (isCharging) {
                            document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-bolt" style="color: #38bdf8;"></i> ${level}%`;
                        } else {
                            document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid ${iconClass}" style="color: ${iconColor};"></i> ${level}%`;
                        }
                    }
                    updateBatteryInfo();
                    battery.addEventListener('levelchange', updateBatteryInfo);
                    battery.addEventListener('chargingchange', updateBatteryInfo);
                } catch (e) {
                    document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-battery-bolt" style="color: #38bdf8;"></i> 100%`;
                }
            } else {
                document.getElementById('batteryStatus').innerHTML = `<i class="fa-solid fa-battery-bolt" style="color: #38bdf8;"></i> 100%`;
            }
        }
        initBattery();

        // Universal Auto-Detection Downloader Engine
        async function autoFetchMedia() {
            const queryVal = document.getElementById('videoUrl').value.trim();
            if(!queryVal) {
                alert("Please paste a valid video link!");
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';

            try {
                let apiUrl = '';
                if (queryVal.includes('instagram.com')) {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/insta?url=${encodeURIComponent(queryVal)}`;
                } else if (queryVal.includes('facebook.com') || queryVal.includes('fb.watch') || queryVal.includes('fb.me')) {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/facebook?url=${encodeURIComponent(queryVal)}`;
                } else {
                    apiUrl = `https://api.sayan-nexuswork.workers.dev/video?query=${encodeURIComponent(queryVal)}`;
                }

                const response = await fetch(apiUrl);
                const data = await response.json();
                
                document.getElementById('loader').style.display = 'none';

                if (data) {
                    const mediaLink = data.url || data.download_url || data.video_url || data.result || data.link;
                    const thumb = data.thumbnail || data.cover || data.image || "https://images.unsplash.com/photo-1611671755657-f3942ec15b13?w=300";
                    const title = data.title || data.name || "Media File Ready";

                    if (mediaLink) {
                        document.getElementById('thumbnail').src = thumb;
                        document.getElementById('videoTitle').innerText = title;
                        
                        document.getElementById('downloadBtn').href = mediaLink;
                        document.getElementById('openBtn').href = mediaLink;

                        document.getElementById('resultBox').style.display = 'flex';
                    } else {
                        alert("Could not extract download link. Please check the link.");
                    }
                } else {
                    alert("No data received from server.");
                }
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                alert("Error: " + error.message);
            }
        }
    </script>
</body>
</html>
